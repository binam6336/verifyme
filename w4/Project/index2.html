<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>warranty</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        .hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <!-- <div class="hint">موس رو تکون بده تا رنگ‌ها هم بخورن</div> -->

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d', { alpha: false });
        let W, H;

        const MAX_W = 900;

        function resize() {
            const scale = Math.min(1, MAX_W / window.innerWidth);
            W = canvas.width = Math.round(window.innerWidth * scale);
            H = canvas.height = Math.round(window.innerHeight * scale);
            canvas._scale = scale;
        }
        resize();
        window.addEventListener('resize', resize);

        const colors = ['#e24b4a', '#378ADD', '#EF9F27', '#1D9E75', '#D4537E', '#7F77DD', '#FAC775', '#63a0e2', '#F0997B'];

        const SPRITE_SIZE = 256;
        const sprites = colors.map(color => {
            const off = document.createElement('canvas');
            off.width = SPRITE_SIZE;
            off.height = SPRITE_SIZE;
            const octx = off.getContext('2d');
            const grad = octx.createRadialGradient(
                SPRITE_SIZE / 2, SPRITE_SIZE / 2, 0,
                SPRITE_SIZE / 2, SPRITE_SIZE / 2, SPRITE_SIZE / 2
            );
            grad.addColorStop(0, color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            octx.fillStyle = grad;
            octx.beginPath();
            octx.arc(SPRITE_SIZE / 2, SPRITE_SIZE / 2, SPRITE_SIZE / 2, 0, Math.PI * 2);
            octx.fill();
            return off;
        });

        const N = 90;
        const particles = [];
        for (let i = 0; i < N; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                r: 30 + Math.random() * 80,
                sprite: sprites[i % sprites.length],
                a: 0.5 + Math.random() * 0.3
            });
        }

        let mouse = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, vx: 0, vy: 0 };

        function setMouse(clientX, clientY) {
            const s = canvas._scale;
            mouse.px = mouse.x;
            mouse.py = mouse.y;
            mouse.x = clientX * s;
            mouse.y = clientY * s;
            mouse.vx = mouse.x - mouse.px;
            mouse.vy = mouse.y - mouse.py;
        }

        window.addEventListener('mousemove', (e) => setMouse(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            setMouse(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });
        window.addEventListener('mouseleave', () => { mouse.vx = 0; mouse.vy = 0; });

        let t = 0;
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);

        function step() {
            t += 0.008;
            const mspeed = Math.hypot(mouse.vx, mouse.vy);
            const stirRadius = 220;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(10,10,10,0.12)';
            ctx.fillRect(0, 0, W, H);

            ctx.globalCompositeOperation = 'lighter';

            for (let i = 0; i < N; i++) {
                const p = particles[i];

                const nx = Math.sin(p.y * 0.006 + t * 1.3) * 0.25;
                const ny = Math.cos(p.x * 0.006 + t * 1.1) * 0.25;
                p.vx += nx * 0.05;
                p.vy += ny * 0.05;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.hypot(dx, dy) + 0.001;
                if (dist < stirRadius && mspeed > 0.5) {
                    const falloff = 1 - dist / stirRadius;
                    const perpX = -dy / dist;
                    const perpY = dx / dist;
                    const swirl = falloff * falloff * 0.9;
                    p.vx += (perpX * mspeed * 0.12 + mouse.vx * 0.05) * swirl;
                    p.vy += (perpY * mspeed * 0.12 + mouse.vy * 0.05) * swirl;
                }

                p.vx *= 0.965;
                p.vy *= 0.965;

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < -p.r) p.x = W + p.r;
                if (p.x > W + p.r) p.x = -p.r;
                if (p.y < -p.r) p.y = H + p.r;
                if (p.y > H + p.r) p.y = -p.r;

                ctx.globalAlpha = p.a * 0.5;
                const d = p.r * 2;
                ctx.drawImage(p.sprite, p.x - p.r, p.y - p.r, d, d);
            }
            ctx.globalAlpha = 1;

            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    </script>
</body>

</html>
